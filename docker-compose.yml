version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /home/gris/.hermes/workspaces:/workspaces:ro
    environment:
      - PYTHONPATH=/app
      - WORKSPACE_ROOT=/workspaces

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend