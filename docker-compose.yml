services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ${WORKSPACE_ROOT:-./vault}:/workspaces
      - lgb-data:/data
    environment:
      - PYTHONPATH=/app
      - WORKSPACE_ROOT=/workspaces
      - DB_PATH=/data/library.db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  lgb-data:
